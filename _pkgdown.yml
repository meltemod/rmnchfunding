url: https://meltemod.github.io/rmnchfunding/

template:
  bootstrap: 5

# pkgdown FAILS the build if a topic is missing from this index, which is the
# point: a newly exported function or dataset cannot be quietly left off the
# site. Add it here when you add it to the package.
reference:
  - title: Fetching OECD data
    desc: >
      Retrieve the two sources the Muskoka method applies coefficients to. Both
      take an explicit price basis, because OECD rebases its own constant series
      with each release.
    contents:
      - oecd_crs
      - oecd_multi

  - title: Inspecting the method
    desc: >
      How OECD recipients map to the World Bank and IHME source data, and which
      of them take a borrowed weight rather than one of their own.
    contents:
      - recipient_map

  - title: Classifying recipients
    desc: >
      OECD classifies recipients geographically, by DAC List income tier and by
      World Bank income group, all at once. Each is a different cut of the same
      money, so each sums to the same total, and each can be cut at a chosen
      level.
    contents:
      - crs_classify

  - title: Coefficient tables
    desc: >
      The weights the method depends on. Most are global constants transcribed
      from the Donors Delivering for SRHR reports; four RMNCH weights vary by
      recipient and year and are computed from source data.
    contents:
      - sector_weights
      - agency_weights
      - rmnch_recipient_weights

  - title: Lookups
    desc: >
      Reference data the fetchers depend on: which recipient codes are
      aggregates, how the hierarchy nests, and how report agency names map to
      OECD channel codes.
    contents:
      - crs_recipients
      - crs_recipient_tree
      - recipient_crosswalk
      - agency_channels

  - title: Package
    contents:
      - rmnchfunding-package
